name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Review toolchain upgrades explicitly; an unpinned pnpm major broke dlx
  # before the plugin tests could start. Never opt out of age/build policy.
  PNPM_VERSION: '12.3.4'
  pnpm_config_minimum_release_age_strict: 'true'
  pnpm_config_strict_dep_builds: 'true'
  # These five lifecycle scripts belong to the official DSH host graph.
  # Deliberate shell word splitting below supplies one flag per package.
  DSH_DLX_BUILD_FLAGS: >-
    --allow-build=@deepseek-ai/dsh-subprocess-local
    --allow-build=@google/genai
    --allow-build=koffi
    --allow-build=node-pty
    --allow-build=protobufjs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: node test/ci-policy.test.mjs
      - run: node plugin/test.mjs
      - name: documented first-migration example
        run: node demo/verify-first-migration.mjs

  platform-test:
    name: platform-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: node plugin/test.mjs
      - name: documented first-migration example
        run: node demo/verify-first-migration.mjs

  opencode-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - name: OpenCode 1.18.23 loads the migrated setup
        run: npm exec --yes --package=opencode-ai@1.18.23 -- node scripts/opencode-live-smoke.mjs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix packages/claude-to-opencode

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # Boot the real DSH host with this checkout installed as a plugin, so a DSH
  # release that breaks the plugin contract fails CI instead of users.
  dsh-boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm install -g "pnpm@$PNPM_VERSION"
      - name: install dsh and this plugin into a scratch profile
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          npm pack --silent
          pnpm dlx $DSH_DLX_BUILD_FLAGS @deepseek-ai/dsh plugin --profile web add "$PWD"/dsh-movein-*.tgz
          echo "DSH_HOME=$DSH_HOME" >> "$GITHUB_ENV"
      - name: composed config contains the plugin and dsh boots the tree
        run: |
          pnpm dlx $DSH_DLX_BUILD_FLAGS @deepseek-ai/dsh --profile web --dump-config > composed.txt
          grep -q "dsh-movein" composed.txt
      - name: OpenCode environment placeholders boot in DSH
        env:
          OPENCODE_CONFIG: ${{ runner.temp }}/opencode.json
          MCP_BIN: node
          MCP_TOKEN: probe
        run: |
          mkdir -p "$RUNNER_TEMP/opencode-project"
          node -e "require('node:fs').writeFileSync(process.env.OPENCODE_CONFIG, JSON.stringify({ mcp: { probe: { type: 'local', command: ['{env:MCP_BIN}', '--token={env:MCP_TOKEN}'] } } }))"
          pnpm dlx $DSH_DLX_BUILD_FLAGS @deepseek-ai/dsh plugin --profile web add @deepseek-ai/dsh-mcp-client
          node bin/cli.mjs "$RUNNER_TEMP/opencode-project" --from opencode --apply
          pnpm dlx $DSH_DLX_BUILD_FLAGS @deepseek-ai/dsh --profile web --dump-config | grep -q "process.env.MCP_TOKEN"
      - name: cli scan runs against a synthetic Claude home
        run: |
          export HOME="$RUNNER_TEMP/fake-home"
          mkdir -p "$HOME/.claude/skills/probe"
          printf -- '---\nname: probe\ndescription: d\n---\nbody\n' > "$HOME/.claude/skills/probe/SKILL.md"
          node bin/cli.mjs | grep -q "skill probe"

  permissions-dsh-compat:
    name: permissions plugin (DSH ${{ matrix.dsh }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.1.0-rc.8, 0.1.1-rc.1, 0.1.1-rc.2, 0.1.2-alpha.3, 0.1.2-alpha.4, 0.1.2-alpha.5, 0.1.2-rc.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm install -g "pnpm@$PNPM_VERSION"
      - name: install, start, and uninstall in a disposable profile
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          DSH_HOME: ${{ runner.temp }}/permissions-dsh-home
        run: |
          npm pack ./plugin --silent --pack-destination "$RUNNER_TEMP"
          TARBALL="$RUNNER_TEMP/dsh-movein-permissions-0.2.7.tgz"
          test -f "$TARBALL"

          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" plugin --profile web add "$TARBALL"
          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" --profile web --dump-config > "$RUNNER_TEMP/composed-before.yml"
          grep -q "dsh-movein-permissions" "$RUNNER_TEMP/composed-before.yml"

          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" web --no-open --host 127.0.0.1 --port 3108 > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          DSH_PID=$!
          cleanup() {
            if kill -0 "$DSH_PID" 2>/dev/null; then
              kill "$DSH_PID" 2>/dev/null || true
              wait "$DSH_PID" || true
            fi
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 60); do
            DSH_URL=$(sed -n 's/^dsh web: //p' "$RUNNER_TEMP/dsh-web.log" | tail -n 1)
            if [ -n "$DSH_URL" ] && curl --fail --silent --show-error --cookie-jar "$RUNNER_TEMP/dsh-cookies.txt" --cookie "$RUNNER_TEMP/dsh-cookies.txt" --location "$DSH_URL" > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$DSH_PID" 2>/dev/null; then
              sed -E 's/(token=)[^[:space:]]+/\1[redacted]/' "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            sed -E 's/(token=)[^[:space:]]+/\1[redacted]/' "$RUNNER_TEMP/dsh-web.log"
            exit 1
          fi

          cleanup
          trap - EXIT
          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" plugin --profile web remove dsh-movein-permissions
          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" --profile web --dump-config > "$RUNNER_TEMP/composed-after.yml"
          if grep -q "dsh-movein-permissions" "$RUNNER_TEMP/composed-after.yml"; then
            exit 1
          fi

  movein-dsh-compat:
    name: movein plugin (DSH ${{ matrix.dsh }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.1.0-rc.8, 0.1.1-rc.1, 0.1.1-rc.2, 0.1.2-alpha.3, 0.1.2-alpha.4, 0.1.2-alpha.5, 0.1.2-rc.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm ci
      - run: npm install -g "pnpm@$PNPM_VERSION"
      - name: install, start, and uninstall in a disposable profile
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          DSH_HOME: ${{ runner.temp }}/movein-dsh-home
        run: |
          npm pack --silent --pack-destination "$RUNNER_TEMP"
          TARBALL="$RUNNER_TEMP/dsh-movein-0.13.8.tgz"
          test -f "$TARBALL"

          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" plugin --profile web add "$TARBALL"
          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" --profile web --dump-config > "$RUNNER_TEMP/composed-before.yml"
          grep -q "dsh-movein" "$RUNNER_TEMP/composed-before.yml"

          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" web --no-open --host 127.0.0.1 --port 3108 > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          DSH_PID=$!
          cleanup() {
            if kill -0 "$DSH_PID" 2>/dev/null; then
              kill "$DSH_PID" 2>/dev/null || true
              wait "$DSH_PID" || true
            fi
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 60); do
            DSH_URL=$(sed -n 's/^dsh web: //p' "$RUNNER_TEMP/dsh-web.log" | tail -n 1)
            if [ -n "$DSH_URL" ] && curl --fail --silent --show-error --cookie-jar "$RUNNER_TEMP/dsh-cookies.txt" --cookie "$RUNNER_TEMP/dsh-cookies.txt" --location "$DSH_URL" > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$DSH_PID" 2>/dev/null; then
              sed -E 's/(token=)[^[:space:]]+/\1[redacted]/' "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            sed -E 's/(token=)[^[:space:]]+/\1[redacted]/' "$RUNNER_TEMP/dsh-web.log"
            exit 1
          fi

          cleanup
          trap - EXIT
          # rc.1 creates its runtime fallback links on first boot, not on a
          # boot-free config dump. Check the latest host after that real boot.
          if [ "$DSH_VERSION" = "0.1.2-rc.1" ]; then
            node bin/cli.mjs doctor --live
          fi
          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" plugin --profile web remove dsh-movein
          pnpm dlx $DSH_DLX_BUILD_FLAGS "@deepseek-ai/dsh@$DSH_VERSION" --profile web --dump-config > "$RUNNER_TEMP/composed-after.yml"
          if grep -q "dsh-movein" "$RUNNER_TEMP/composed-after.yml"; then
            exit 1
          fi

  ci-gate:
    if: always()
    needs: [test, platform-test, opencode-compat, security, codeql, dsh-boot-smoke, permissions-dsh-compat, movein-dsh-compat]
    runs-on: ubuntu-latest
    steps:
      - name: require every CI lane to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PLATFORM_RESULT: ${{ needs.platform-test.result }}
          OPENCODE_RESULT: ${{ needs.opencode-compat.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DSH_BOOT_RESULT: ${{ needs.dsh-boot-smoke.result }}
          PERMISSIONS_COMPAT_RESULT: ${{ needs.permissions-dsh-compat.result }}
          MOVEIN_COMPAT_RESULT: ${{ needs.movein-dsh-compat.result }}
        run: |
          node -e "const names = ['TEST_RESULT', 'PLATFORM_RESULT', 'OPENCODE_RESULT', 'SECURITY_RESULT', 'CODEQL_RESULT', 'DSH_BOOT_RESULT', 'PERMISSIONS_COMPAT_RESULT', 'MOVEIN_COMPAT_RESULT']; const failed = names.filter((name) => process.env[name] !== 'success'); if (failed.length) { console.error(failed.map((name) => name + '=' + process.env[name]).join('\\n')); process.exit(1); }"
